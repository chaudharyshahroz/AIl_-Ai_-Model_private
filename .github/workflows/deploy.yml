name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Dokploy registry
        if: env.DOCKER_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKER_REGISTRY != '' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/reklu:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/reklu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-dokploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy webhook
        run: |
          if [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "No DOKPLOY_WEBHOOK_URL set; skipping redeploy trigger."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}","action":"deploy"}' \
            -o /dev/null
          echo "Triggered Dokploy deploy."

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
